name: catalystlens

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CATALYSTLENS_ENVIRONMENT: local
      CATALYSTLENS_CORS_ORIGINS: http://localhost:8080
      CATALYSTLENS_TOP_K: 2
      CATALYSTLENS_MODEL_PROVIDER: extractive
    ports:
      - '127.0.0.1:8000:8000'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
