[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalystlens-api"
version = "0.2.0"
description = "Self-hosted news-to-market catalyst research API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.9,<1"]
training = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "torch>=2.4,<3",
  "transformers>=4.48,<6",
]
semantic = ["sentence-transformers>=3.3,<6", "qdrant-client>=1.13,<2"]
observability = [
  "opentelemetry-distro>=0.50b0,<1",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
